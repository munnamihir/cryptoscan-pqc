name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests including CycloneDX 1.6 schema validation
        run: python -m unittest discover -s tests -v
      - name: Self-scan (smoke test)
        run: python -m cryptoscan scan sample_vulnerable_app --no-color

  action-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise single-file Action scan
        uses: ./
        with:
          path: sample_vulnerable_app/auth.py
          output: cbom-success.json
          artifact-name: cbom-success
      - name: Download success artifact
        uses: actions/download-artifact@v4
        with:
          name: cbom-success
          path: downloaded-success
      - name: Verify success CBOM
        run: python -c "import json; x=json.load(open('downloaded-success/cbom-success.json')); assert x['specVersion']=='1.6'; assert x['components']"
      - name: Exercise failure-gated Action scan
        id: expected_failure
        uses: ./
        continue-on-error: true
        with:
          path: sample_vulnerable_app
          output: cbom-failure.json
          artifact-name: cbom-failure
          fail-on-vulnerable: "true"
      - name: Confirm fail-on-vulnerable fails
        env:
          SCAN_OUTCOME: ${{ steps.expected_failure.outcome }}
        run: test "$SCAN_OUTCOME" = "failure"
      - name: Download failure artifact
        uses: actions/download-artifact@v4
        with:
          name: cbom-failure
          path: downloaded-failure
      - name: Verify failure CBOM
        run: python -c "import json; x=json.load(open('downloaded-failure/cbom-failure.json')); assert x['components']"
      - name: Create path with literal shell metacharacters
        run: |
          mkdir -p 'test-fixtures/$(touch injected-by-action)'
          printf 'import hashlib; hashlib.md5(b"x")\n' > 'test-fixtures/$(touch injected-by-action)/sample.py'
      - name: Exercise untrusted string inputs
        uses: ./
        with:
          path: 'test-fixtures/$(touch injected-by-action)'
          output: 'test-fixtures/$(touch injected-by-action)/cbom.json'
          artifact-name: cbom-injection-test
      - name: Assert untrusted inputs were not executed
        run: |
          test ! -e injected-by-action
          python -c "import json; x=json.load(open('test-fixtures/$(touch injected-by-action)/cbom.json')); assert x['components']"
