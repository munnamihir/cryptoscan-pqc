name: "cryptoscan-pqc"
description: "Scan code for quantum-vulnerable cryptography and generate a CycloneDX 1.6 CBOM"
author: "Mihir Bommisetty"
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: "File or directory to scan"
    required: false
    default: "."
  output:
    description: "Path to write the CycloneDX CBOM JSON"
    required: false
    default: "cbom.json"
  artifact-name:
    description: "Name of the uploaded CBOM artifact (unique within a workflow run)"
    required: false
    default: "cbom"
  fail-on-vulnerable:
    description: "Fail the job if quantum-vulnerable or classically broken cryptography is found"
    required: false
    default: "false"
  version:
    description: "Optional exact PyPI package version; when empty, install scanner bundled with this Action"
    required: false
    default: ""
  dashboard:
    description: "Generate and upload a self-contained interactive HTML report alongside the CBOM"
    required: false
    default: "true"
  dashboard-output:
    description: "Path to write the optional offline HTML dashboard"
    required: false
    default: "cryptoscan-dashboard.html"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install cryptoscan-pqc
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_SOURCE: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_VERSION" ]]; then
          python -m pip install "cryptoscan-pqc==$INPUT_VERSION"
        else
          python -m pip install "$ACTION_SOURCE"
        fi
    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON_VULNERABLE: ${{ inputs.fail-on-vulnerable }}
      run: |
        set -euo pipefail
        args=(scan "$INPUT_PATH" -o "$INPUT_OUTPUT")
        if [[ "$INPUT_FAIL_ON_VULNERABLE" == "true" ]]; then
          args+=(--fail-on-vulnerable)
        fi
        python -m cryptoscan "${args[@]}"
    - name: Upload CBOM even if scan reports vulnerable cryptography
      if: ${{ always() && steps.scan.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
        if-no-files-found: error
    - name: Generate offline dashboard even if vulnerable cryptography was found
      id: dashboard
      if: ${{ always() && inputs.dashboard == 'true' && steps.scan.outcome != 'skipped' }}
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
        INPUT_CBOM: ${{ inputs.output }}
        INPUT_DASHBOARD_OUTPUT: ${{ inputs.dashboard-output }}
      run: |
        set -euo pipefail
        if [[ ! -f "$INPUT_CBOM" ]]; then
          echo "::warning::No CBOM JSON was produced; skipping the dashboard."
          exit 1
        fi
        python "$ACTION_SOURCE/dashboard/build_dashboard.py" "$INPUT_CBOM" -o "$INPUT_DASHBOARD_OUTPUT"
    - name: Upload interactive HTML dashboard
      if: ${{ always() && steps.dashboard.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-dashboard
        path: ${{ inputs.dashboard-output }}
        if-no-files-found: error
